  <text x="520" y="76" text-anchor="middle" font-size="10.5" fill="#6E7681">dormant by default — activates purely by configuration, fiat rails unaffected</text>

  <!-- ===== LEFT: buyback-burn cycle ===== -->
  <text x="60" y="112" font-size="11" letter-spacing="3" fill="#BC8CFF">BUYBACK-BURN CYCLE</text>

  <!-- ROW A: taxi revenue — RUB debt book -->
  <g>
    <rect x="60" y="124" width="150" height="64" rx="14" fill="url(#ocCard)" stroke="#2D3742"/>
    <text x="135" y="150" text-anchor="middle" font-size="13" font-weight="600" fill="#E6EDF3">Platform</text>
    <text x="135" y="168" text-anchor="middle" font-size="13" font-weight="600" fill="#E6EDF3">revenue</text>
  </g>
  <line x1="212" y1="156" x2="254" y2="156" stroke="#BC8CFF" stroke-width="2" marker-end="url(#ocArrV)"/>
  <g>
    <rect x="258" y="124" width="164" height="64" rx="14" fill="url(#ocCard)" stroke="#BC8CFF" stroke-dasharray="5 4"/>
    <text x="340" y="148" text-anchor="middle" font-size="12.5" font-weight="600" fill="#D2A8FF">RUB debt book</text>
    <text x="340" y="167" text-anchor="middle" font-size="10" fill="#8B949E">per completed ride</text>
  </g>
  <line x1="424" y1="156" x2="466" y2="156" stroke="#BC8CFF" stroke-width="2" marker-end="url(#ocArrV)"/>
  <g>
    <rect x="470" y="124" width="290" height="64" rx="14" fill="#1A1228" stroke="#BC8CFF"/>
    <text x="492" y="152" font-size="17" font-weight="700" fill="#D2A8FF">100%</text>
    <text x="556" y="146" font-size="12.5" font-weight="600" fill="#E6EDF3">burned forever</text>
    <text x="556" y="163" font-size="10" fill="#8B949E">Safe burn on L1 · monthly</text>
    <text x="556" y="177" font-size="10" fill="#8B949E">OMNI rate fixed at burn date</text>
  </g>

  <!-- ROW B: protocol fees — FeeSplitter -->
  <g>
    <rect x="60" y="212" width="150" height="64" rx="14" fill="url(#ocCard)" stroke="#2D3742"/>
    <text x="135" y="238" text-anchor="middle" font-size="13" font-weight="600" fill="#E6EDF3">Protocol</text>
    <text x="135" y="256" text-anchor="middle" font-size="13" font-weight="600" fill="#E6EDF3">fees</text>
  </g>
  <line x1="212" y1="244" x2="254" y2="244" stroke="#BC8CFF" stroke-width="2" marker-end="url(#ocArrV)"/>
  <g>
    <rect x="258" y="212" width="164" height="64" rx="14" fill="url(#ocCard)" stroke="#BC8CFF" stroke-dasharray="5 4"/>
    <text x="340" y="236" text-anchor="middle" font-size="12.5" font-weight="600" fill="#D2A8FF">FeeSplitter</text>
    <text x="340" y="255" text-anchor="middle" font-size="10" fill="#8B949E">sweep() · permissionless</text>
  </g>
  <path d="M424 244 L452 244 L452 218 L466 218" fill="none" stroke="#BC8CFF" stroke-width="2" marker-end="url(#ocArrV)"/>
  <path d="M424 244 L452 244 L452 274 L466 274" fill="none" stroke="#BC8CFF" stroke-width="2" marker-end="url(#ocArrV)"/>
  <g>
    <rect x="470" y="196" width="290" height="44" rx="12" fill="#1A1228" stroke="#BC8CFF"/>
    <text x="490" y="224" font-size="15" font-weight="700" fill="#D2A8FF">70%</text>
    <text x="540" y="218" font-size="12" font-weight="600" fill="#E6EDF3">burned forever</text>
    <text x="540" y="232" font-size="9.5" fill="#8B949E">OMNIBurner → 0x…dEaD</text>
  </g>
  <g>
    <rect x="470" y="252" width="290" height="44" rx="12" fill="url(#ocCard)" stroke="#2D3742"/>
    <text x="490" y="280" font-size="15" font-weight="700" fill="#8B949E">30%</text>
    <text x="540" y="274" font-size="12" font-weight="600" fill="#E6EDF3">treasury</text>
    <text x="540" y="288" font-size="9.5" fill="#8B949E">OMNICORTreasury</text>
  </g>

  <text x="410" y="326" text-anchor="middle" font-size="10.5" fill="#6E7681">every cycle leaves verifiable on-chain evidence —</text>
  <text x="410" y="341" text-anchor="middle" font-size="10.5" fill="#6E7681">no trust in platform accounting required</text>

  <!-- divider -->
  <line x1="800" y1="104" x2="800" y2="330" stroke="#21262D"/>

  <!-- ===== RIGHT: emission ===== -->
  <text x="828" y="112" font-size="11" letter-spacing="3" fill="#BC8CFF">EMISSION</text>

  <!-- bars -->
  <g font-size="10.5">
    <rect x="828" y="124" width="26" height="26" rx="6" fill="url(#ocViolet)"/>
    <text x="862" y="137" fill="#E6EDF3" font-weight="600">10%</text>
    <text x="862" y="150" fill="#8B949E">circulating at launch</text>

    <rect x="828" y="162" width="52" height="26" rx="6" fill="#8957E5" opacity="0.85"/>
    <text x="888" y="175" fill="#E6EDF3" font-weight="600">20%</text>
    <text x="888" y="188" fill="#8B949E">founder allocation</text>

    <rect x="828" y="200" width="172" height="26" rx="6" fill="#BC8CFF" opacity="0.35" stroke="#BC8CFF" stroke-dasharray="4 3"/>
    <text x="1008" y="213" text-anchor="end" fill="#E6EDF3" font-weight="600">70%</text>
    <text x="828" y="246" fill="#8B949E">ecosystem reserve — quarterly tranches</text>
  </g>

