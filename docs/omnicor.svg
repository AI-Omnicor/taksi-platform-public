  <g>
    <text x="828" y="286" font-size="10.5" fill="#8B949E">10-yr decaying schedule · unclaimed burns:</text>
    <rect x="828" y="296" width="15" height="34" rx="3" fill="#BC8CFF" opacity="0.9"/>
    <rect x="848" y="303" width="15" height="27" rx="3" fill="#BC8CFF" opacity="0.75"/>
    <rect x="868" y="309" width="15" height="21" rx="3" fill="#BC8CFF" opacity="0.6"/>
    <rect x="888" y="314" width="15" height="16" rx="3" fill="#BC8CFF" opacity="0.5"/>
    <rect x="908" y="318" width="15" height="12" rx="3" fill="#BC8CFF" opacity="0.4"/>
    <rect x="928" y="321" width="15" height="9" rx="3" fill="#BC8CFF" opacity="0.32"/>
    <rect x="948" y="324" width="15" height="6" rx="3" fill="#BC8CFF" opacity="0.25"/>
    <text x="972" y="332" font-size="10" fill="#6E7681">each release &lt; previous</text>
  </g>

  <text x="520" y="378" text-anchor="middle" font-size="10.5" fill="#6E7681">hot executor wallets · cold corporate treasury · idempotent flows · batch caps · gas circuit breakers</text>
  <text x="520" y="404" text-anchor="middle" font-size="10" fill="#3A4048">TAKSI · AI-Omnicor</text>
</svg>
