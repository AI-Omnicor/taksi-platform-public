<svg xmlns="http://www.w3.org/2000/svg" width="1040" height="430" viewBox="0 0 1040 430" font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif">
  <defs>
    <linearGradient id="ocCard" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#1C232C"/>
      <stop offset="1" stop-color="#161C24"/>
    </linearGradient>
    <linearGradient id="ocViolet" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#BC8CFF"/>
      <stop offset="1" stop-color="#8957E5"/>
    </linearGradient>
    <linearGradient id="ocGreen" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#2BD46B"/>
      <stop offset="1" stop-color="#17A75A"/>
    </linearGradient>
    <marker id="ocArrV" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0,0 L10,5 L0,10 Z" fill="#BC8CFF"/>
    </marker>
  </defs>

  <rect x="0.5" y="0.5" width="1039" height="429" rx="18" fill="#0D1117" stroke="#21262D"/>
  <text x="520" y="44" text-anchor="middle" font-size="13" letter-spacing="6" fill="#8B949E">OMNICOR L2 · OMNI TOKENOMICS</text>
